[package]
name = "healdep"
version.workspace = true
edition.workspace = true

[[bin]]
name = "healdep"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.18"
semver = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
healdep-synthesizer = { path = "../healdep-synthesizer" }
healdep-sandbox = { path = "../healdep-sandbox" }
healdep-registry = { path = "../healdep-registry" }
indicatif = "0.17"
console = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

