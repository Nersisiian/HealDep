services:
  healdep:
    build:
      context: .
      pull: true          # тянуть свежий образ rust:1.86-slim
    ports:
      - "5000:5000"
    volumes:
      - ./examples:/app/examples
      - ./healed_shims:/app/healed_shims
      - ./healed_shims_py:/app/healed_shims_py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HEALDEP_AI_PROVIDER=${HEALDEP_AI_PROVIDER:-ollama}
      - HEALDEP_OLLAMA_URL=http://host.docker.internal:11434
