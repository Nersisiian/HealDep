name: HealDep CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Установка Rust
      uses: actions-rs/toolchain@v1.0.6
      with:
        toolchain: 1.86.0
        override: true
        components: rustfmt, clippy

    - name: Кэш cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Форматирование (rustfmt)
      run: cargo fmt --all -- --check

    - name: Линтинг (clippy)
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Сборка
      run: cargo build --release

    - name: Тесты (заглушка)
      run: cargo test --verbose || echo "Тесты будут добавлены позже"

    - name: Проверка Python-части
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: |
        pip install -r python/requirements.txt
        python python/healdep_python.py analyze examples/demo_python/requirements.txt

  publish-docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Логин в GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Извлечение метаданных
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}
        tags: |
          type=ref,event=tag
          type=sha,prefix=

    - name: Сборка и пуш Docker-образа
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

