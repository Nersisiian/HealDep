name: Auto-Heal Dependabot/Renovate PRs

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  heal:
    if: contains(github.head_ref, 'dependabot') || contains(github.head_ref, 'renovate')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.86.0
        override: true

    - name: Build HealDep (если не установлен глобально)
      run: cargo build --release

    - name: Run HealDep for Cargo
      if: hashFiles('Cargo.toml') != ''
      run: ./target/release/healdep heal --ai || true

    - name: Run HealDep for Python
      if: hashFiles('requirements.txt') != ''
      run: python python/healdep_python.py heal requirements.txt --ai || true

    - name: Commit healed files
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "🤖 HealDep: автоматическое лечение конфликтов в PR"
        file_pattern: 'healed_shims/** healed_shims_py/**'
        commit_user_name: HealDep Bot
        commit_user_email: bot@healdep.dev

